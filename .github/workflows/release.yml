name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cc: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            cross: gcc-aarch64-linux-gnu
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y make git gcc libc6-dev bash xz-utils ca-certificates ${{ matrix.cross }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and stage
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ver=$(GIT_DIR="$GITHUB_WORKSPACE/.git" git describe --dirty | sed 's/^v//')
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          make -C src CC=${{ matrix.cc }}
          make -C src install DESTDIR="$GITHUB_WORKSPACE/stage" PREFIX=/usr \
            WITH_WGQUICK=yes WITH_BASHCOMPLETION=yes WITH_SYSTEMDUNITS=yes
          install -Dm0644 COPYING "stage/usr/share/licenses/wireguard-tools/COPYING"
          tar -C stage -cJf "wireguard-tools-$ver-linux-${{ matrix.arch }}.tar.xz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: '*.tar.xz'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build universal binary and stage
        env:
          CFLAGS: -O3 -arch arm64 -arch x86_64
          LDFLAGS: -arch arm64 -arch x86_64
        run: |
          ver=$(GIT_DIR="$GITHUB_WORKSPACE/.git" git describe --dirty | sed 's/^v//')
          make -C src
          make -C src install DESTDIR="$GITHUB_WORKSPACE/stage" PREFIX=/usr/local \
            WITH_WGQUICK=yes WITH_BASHCOMPLETION=yes WITH_SYSTEMDUNITS=no
          install -Dm0644 COPYING "stage/usr/local/share/licenses/wireguard-tools/COPYING"
          tar -C stage -cJf "wireguard-tools-$ver-macos-universal.tar.xz" .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: '*.tar.xz'

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.xz > SHA256SUMS
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            *.tar.xz SHA256SUMS
